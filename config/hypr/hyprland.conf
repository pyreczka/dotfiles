# Hyprland Configuration - Futura Aero Style
# Author: pyreczka
# Theme: Minimalist, elegant

# Monitor setup
monitor=,preferred,auto,1

# Environment variables
env = XCURSOR_SIZE,24
env = XCURSOR_THEME,Hyprcursor

# Execute on startup
exec-once = waybar
exec-once = hyprpaper

# Input method
input {
    kb_layout = pl
    kb_variant =
    kb_model =
    kb_options = compose:ralt
    kb_rules =
    follow_mouse = 1
    touchpad {
        natural_scroll = no
    }
    sensitivity = 0
}

# General settings
general {
    gaps_in = 8
    gaps_out = 12
    border_size = 2
    col.active_border = rgba(c9b0eeff) rgba(89b4faff) 45deg
    col.inactive_border = rgba(45475aff)
    layout = dwindle
    no_cursor_warps = true
}

# Decorations
decoration {
    rounding = 8
    blur {
        enabled = true
        size = 4
        passes = 2
        xray = false
        vibrancy = 0.1696
    }
    drop_shadow = yes
    shadow_range = 8
    shadow_render_power = 3
    col.shadow = rgba(1e1e2e99)
    col.shadow_inactive = rgba(00000000)
}

# Animation settings
animations {
    enabled = yes
    animation = windows,1,5,default,popin 80%
    animation = windowsOut,1,5,default,popin 80%
    animation = windowsMove,1,5,default,popin 80%
    animation = fade,1,10,default
    animation = border,1,10,default
    animation = borderangle,1,10,default,loop
    animation = workspaces,1,5,default,slidefadevert 20%
}

# Layouts
dwindle {
    pseudotile = yes
    preserve_split = yes
}

master {
    new_is_master = true
}

# Gestures
gestures {
    workspace_swipe = true
    workspace_swipe_forever = false
    workspace_swipe_min_speed_to_force = 30
}

# Window rules
windowrule = float,^(pavucontrol)$
windowrule = float,^(blueman-manager)$
windowrule = float,^(nm-connection-editor)$
windowrule = opacity 0.95,^(kitty)$
windowrule = opacity 0.90,^(rofi)$

# KEYBOARD SHORTCUTS
# ==================

# Mod key
$mainMod = SUPER

# Application shortcuts
bind = $mainMod, Return, exec, kitty
bind = $mainMod, A, exec, rofi -show drun -theme ~/.config/rofi/aero.rasi
bind = $mainMod, L, exec, swaylock -c 1e1e2e
bind = $mainMod, Q, killactive,
bind = $mainMod, M, exit,

# Window management
bind = $mainMod, F, fullscreen, 0
bind = $mainMod, Space, togglefloating,
bind = $mainMod, P, pseudo,
bind = $mainMod, V, togglesplit,

# Focus navigation (Arrow keys)
bind = $mainMod, Left, movefocus, l
bind = $mainMod, Right, movefocus, r
bind = $mainMod, Up, movefocus, u
bind = $mainMod, Down, movefocus, d

# Focus navigation (Vim style)
bind = $mainMod, H, movefocus, l
bind = $mainMod, L, movefocus, r
bind = $mainMod, K, movefocus, u
bind = $mainMod, J, movefocus, d

# Move windows (Arrow keys)
bind = $mainMod SHIFT, Left, movewindow, l
bind = $mainMod SHIFT, Right, movewindow, r
bind = $mainMod SHIFT, Up, movewindow, u
bind = $mainMod SHIFT, Down, movewindow, d

# Move windows (Vim style)
bind = $mainMod SHIFT, H, movewindow, l
bind = $mainMod SHIFT, L, movewindow, r
bind = $mainMod SHIFT, K, movewindow, u
bind = $mainMod SHIFT, J, movewindow, d

# Workspace switching (1-9)
bind = $mainMod, 1, workspace, 1
bind = $mainMod, 2, workspace, 2
bind = $mainMod, 3, workspace, 3
bind = $mainMod, 4, workspace, 4
bind = $mainMod, 5, workspace, 5
bind = $mainMod, 6, workspace, 6
bind = $mainMod, 7, workspace, 7
bind = $mainMod, 8, workspace, 8
bind = $mainMod, 9, workspace, 9

# Move window to workspace
bind = $mainMod SHIFT, 1, movetoworkspace, 1
bind = $mainMod SHIFT, 2, movetoworkspace, 2
bind = $mainMod SHIFT, 3, movetoworkspace, 3
bind = $mainMod SHIFT, 4, movetoworkspace, 4
bind = $mainMod SHIFT, 5, movetoworkspace, 5
bind = $mainMod SHIFT, 6, movetoworkspace, 6
bind = $mainMod SHIFT, 7, movetoworkspace, 7
bind = $mainMod SHIFT, 8, movetoworkspace, 8
bind = $mainMod SHIFT, 9, movetoworkspace, 9

# Workspace cycling with scroll
bind = $mainMod, mouse_down, workspace, e+1
bind = $mainMod, mouse_up, workspace, e-1

# Mouse bindings
bindm = $mainMod, mouse:272, movewindow
bindm = $mainMod, mouse:273, resizewindow
