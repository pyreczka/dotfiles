# Kitty Configuration - Futura Aero Style

# Font settings
font_family Fira Code
font_size 12
line_height 1.5

# Window padding
window_padding_width 12 8
window_margin_width 0

# Appearance
enabled_layouts tall:bias=50;full_size=1;mirrored=false,fat,grid,horizontal,vertical,stack
window_border_width 2
window_margin_width 8
window_padding_width 8

# Tab bar
tab_bar_edge top
tab_bar_style powerline
tab_powerline_style slanted
tab_title_template "{title}"

# Color scheme - Catppuccin Mocha
include themes/Catppuccin-Mocha.conf

# Cursor settings
cursor_shape beam
cursor_blink_interval 0.5

# Scrollback history
scrollback_lines 10000

# Mouse settings
mouse_hide_wait 3.0
select_by_word_characters :@-./_~?&=%+#

# URL handling
open_url_with default
url_prefixes http https file ftp

# Kitty server mode
allow_remote_control yes
listen_on unix:@mykitty

# Keyboard shortcuts
map super+c copy_to_clipboard
map super+v paste_from_clipboard
map super+shift+c new_os_window
map super+shift+n new_window_with_cwd
map super+shift+w close_window
map super+shift+l next_layout
map super+shift+t new_tab_with_cwd
map super+shift+q close_tab
map super+right next_window
map super+left previous_window
map super+1 goto_tab 1
map super+2 goto_tab 2
map super+3 goto_tab 3
map super+4 goto_tab 4
map super+5 goto_tab 5
map super+6 goto_tab 6
map super+7 goto_tab 7
map super+8 goto_tab 8
map super+9 goto_tab 9

# Font features
font_features Fira Code +zero +ss01 +ss02 +ss03

# Background
background #1e1e2e
background_opacity 0.95

# Hide decorations on Linux
hide_window_decorations no

# Update check
update_check_interval 0
